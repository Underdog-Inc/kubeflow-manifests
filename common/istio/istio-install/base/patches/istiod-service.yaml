apiVersion: v1
kind: Service
metadata:
  name: istiod
  namespace: istio-system
  annotations:
    ad.datadoghq.com/service.check_names: '["istio"]'
    ad.datadoghq.com/service.init_configs: '[{}]'
    ad.datadoghq.com/service.instances: '[{"istiod_endpoint": "http://%%host%%:15014/metrics", "use_openmetrics": true}]'
